{% extends "mis_tareas/master.html" %}
{% block title %}login{% endblock %}
{% block content %}
    <h1>Inicia sesion</h1>

    {%if form.errors %}
      <p>El usuario o la contraseñas no son correctos</p>
    {%endif %}

    <!--introduce tu usuario:-->
    <form method="POST">
      {% csrf_token %}
      {{form.as_p}}
      <button type="submit">Entrar</button>
    </form>
    <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
{% endblock %}
